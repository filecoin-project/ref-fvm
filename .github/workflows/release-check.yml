name: Release Checker

on:
  # Change to pull_request_target for the workflow to function correctly on PRs from forks
  pull_request:
    paths:
      - "**/Cargo.toml"
    types: [ opened, synchronize, reopened, labeled, unlabeled ]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-check:
    uses: ipdxco/unified-github-workflows/.github/workflows/release-check.yml@v1.0
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.pull_request.head.repo.fork }}
    with:
      sources: |
        [
          "fvm/Cargo.toml",
          "testing/integration/Cargo.toml",
          "ipld/amt/Cargo.toml",
          "ipld/bitfield/Cargo.toml",
          "ipld/blockstore/Cargo.toml",
          "ipld/car/Cargo.toml",
          "ipld/encoding/Cargo.toml",
          "ipld/hamt/Cargo.toml",
          "ipld/kamt/Cargo.toml",
          "sdk/Cargo.toml",
          "shared/Cargo.toml"
        ]
      separator: "@"

  cargo-publish:
    needs: [release-check]
    if: needs.release-check.outputs.json != '{}'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Install required packages
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 10
          max_attempts: 3
          shell: bash
          command: |
            sudo apt-get update
            sudo apt-get install --no-install-recommends --yes libhwloc-dev ocl-icd-opencl-dev
      - name: Install cargo-release
        uses: taiki-e/install-action@f1390fd0d8205ae79e5e57b1d1e300dceeb4163e
        with:
          tool: cargo-release@1.1.5
      - name: Dry-run publish
        run: |
          # cargo-release's publish subcommand skips already-published crates
          # while preserving workspace ordering for unpublished ones.
          cargo release publish --workspace --allow-branch HEAD --no-confirm
