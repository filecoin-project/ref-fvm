name: Release Checker

on:
  # Change to pull_request_target for the workflow to function correctly on PRs from forks
  pull_request:
    paths:
      - "**/Cargo.toml"
    types: [ opened, synchronize, reopened, labeled, unlabeled ]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-check:
    uses: ipdxco/unified-github-workflows/.github/workflows/release-check.yml@d9b156f4be9fae6843707f5e5cda2fb079f821ac # v1.0.45
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.pull_request.head.repo.fork }}
    with:
      sources: |
        [
          "fvm/Cargo.toml",
          "sdk/Cargo.toml",
          "shared/Cargo.toml"
        ]
      separator: "@"
      branches: '["release/v3"]'
  cargo-publish:
    needs: [release-check]
    if: needs.release-check.outputs.json != '{}'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install required packages
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 10
          max_attempts: 3
          shell: bash
          command: |
            sudo apt-get update
            sudo apt-get install --no-install-recommends --yes libhwloc-dev ocl-icd-opencl-dev
      - name: Dry-run publish
        run: |
          # Use cargo publish --workspace --dry-run to verify the entire workspace at once.
          # This correctly handles interdependent crates which a matrix-based approach misses.
          cargo publish --workspace --dry-run
