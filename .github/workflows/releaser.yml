name: Releaser

on:
  push:
    paths:
      - "**/Cargo.toml"
  workflow_dispatch:
    inputs:
      ref:
        description: "Ref to publish"
        required: true
        type: string
      exclude:
        description: "Space-separated crate names to skip (e.g. members already published at their current version)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ inputs.ref || github.sha }}
  cancel-in-progress: true

jobs:
  releaser:
    if: github.event_name != 'workflow_dispatch'
    uses: ipdxco/unified-github-workflows/.github/workflows/releaser.yml@v1.0
    with:
      sources: |
        [
          "fvm/Cargo.toml",
          "testing/integration/Cargo.toml",
          "ipld/amt/Cargo.toml",
          "ipld/bitfield/Cargo.toml",
          "ipld/blockstore/Cargo.toml",
          "ipld/car/Cargo.toml",
          "ipld/encoding/Cargo.toml",
          "ipld/hamt/Cargo.toml",
          "ipld/kamt/Cargo.toml",
          "sdk/Cargo.toml",
          "shared/Cargo.toml"
        ]
      separator: "@"
    secrets:
      UCI_GITHUB_TOKEN: ${{ secrets.UCI_GITHUB_TOKEN }}

  cargo-publish:
    needs: [releaser]
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || (needs.releaser.result == 'success' && needs.releaser.outputs.json != '{}')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Install required packages
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 10
          max_attempts: 3
          shell: bash
          command: |
            sudo apt-get update
            sudo apt-get install --no-install-recommends --yes libhwloc-dev ocl-icd-opencl-dev
      - name: Authenticate with crates.io
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
          EXCLUDE: ${{ inputs.exclude }}
        run: |
          # Use cargo publish --workspace to publish the crates in the workspace in dependency order.
          # cargo does NOT skip members that are already published at their current version; it
          # fails with "crate X@Y already exists on crates.io index". On a manual dispatch, pass such
          # crates via the `exclude` input so they are dropped from the publish set.
          args=()
          for crate in $EXCLUDE; do
            args+=(--exclude "$crate")
          done
          cargo publish --workspace "${args[@]}"
