name: Releaser

on:
  push:
    branches:
      - main
    paths:
      - "**/Cargo.toml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  releaser:
    uses: ipdxco/unified-github-workflows/.github/workflows/releaser.yml@v1.0
    with:
      sources: |
        [
          "fvm/Cargo.toml",
          "testing/integration/Cargo.toml",
          "ipld/amt/Cargo.toml",
          "ipld/bitfield/Cargo.toml",
          "ipld/blockstore/Cargo.toml",
          "ipld/car/Cargo.toml",
          "ipld/encoding/Cargo.toml",
          "ipld/hamt/Cargo.toml",
          "ipld/kamt/Cargo.toml",
          "sdk/Cargo.toml",
          "shared/Cargo.toml"
        ]
      separator: "@"
    secrets:
      UCI_GITHUB_TOKEN: ${{ secrets.UCI_GITHUB_TOKEN }}

  cargo-publish:
    needs: [releaser]
    if: needs.releaser.outputs.json != '{}'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Install required packages
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 10
          max_attempts: 3
          shell: bash
          command: |
            sudo apt-get update
            sudo apt-get install --no-install-recommends --yes libhwloc-dev ocl-icd-opencl-dev
      - name: Install cargo-release
        uses: taiki-e/install-action@f1390fd0d8205ae79e5e57b1d1e300dceeb4163e
        with:
          tool: cargo-release@1.1.5
      - name: Authenticate with crates.io
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
        run: |
          # cargo-release's publish subcommand skips already-published crates
          # while preserving workspace ordering for unpublished ones.
          cargo release publish --workspace --no-confirm --execute
