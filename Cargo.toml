[workspace]
resolver = "3"
members = [
    "fvm",
    "sdk",
    "shared",
    "testing/conformance",
]

[workspace.package]
version = "2.13.0"
license = "MIT OR Apache-2.0"
edition = "2024"
repository = "https://github.com/filecoin-project/ref-fvm"
authors = ["Protocol Labs", "Filecoin Core Devs"]

[workspace.dependencies]
cid = { version = "0.11.3", default-features = false }
multihash-codetable = { version = "0.2", default-features = false }
multihash-derive = { version = "0.9.1", default-features = false }
fvm_ipld_hamt = { version = "0.10.4"}
fvm_ipld_car = { version = "0.9.0" }
fvm_ipld_blockstore = { version = "0.3.1" }
fvm_ipld_encoding = { version = "0.5.3" }
# wasmtime: LTS majors only, see deny.toml
wasmtime = {version = "48.0.8", default-features = false, features = ["anyhow", "cranelift", "pooling-allocator", "parallel-compilation", "runtime"] }

fvm = { path = "fvm", version = "~2.13.0", default-features = false }
fvm_shared = { path = "shared", version = "~2.13.0", default-features = false }

[profile.actor]
inherits = "release"
panic = "abort"
overflow-checks = true
lto = true
opt-level = "z"
#strip = true
