[advisories]
ignore = [
  "RUSTSEC-2025-0057", # fxhash is no longer maintained, tracked in https://github.com/filecoin-project/ref-fvm/issues/2221
  "RUSTSEC-2025-0141", # bincode unmaintained, transitive dep via bellperson/filecoin-proofs
  "RUSTSEC-2024-0436", # paste unmaintained (indirect dep via alloy) - the upstream ignores the advisory, nothing to be done
  "RUSTSEC-2026-0387", # crypto-bigint 0.5 timing (via k256), fixed only in 0.7; shipped code only verifies/recovers public signatures, signing is test-only
]

[bans]
multiple-versions = "allow"

[sources]
allow-git = [ "https://github.com/filecoin-project/builtin-actors" ]

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "MIT",
  "NCSA",
  "Unlicense",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]
